name: Build QFlip

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
            artifact: QFlip-macOS
          - os: windows-latest
            cmake_args: ''
            artifact: QFlip-Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cmake_args }}" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "${{ matrix.cmake_args }}"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release -j

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          STAGE="$RUNNER_TEMP/QFlip-dmg/QFlip"
          mkdir -p "$STAGE"
          find build/QFlip_artefacts -name "*.vst3" -exec cp -R {} "$STAGE/" \;
          find build/QFlip_artefacts -name "*.component" -exec cp -R {} "$STAGE/" \;
          create-dmg --volname "QFlip" "QFlip-v0.1.0-macOS.dmg" "$STAGE"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/QFlip_artefacts/

      - name: Upload DMG (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: QFlip-macOS-DMG
          path: QFlip-v0.1.0-macOS.dmg
